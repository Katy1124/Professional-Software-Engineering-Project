name: Build and deploy Node.js app to Azure Web App - Giacom

on:
  push:
    branches:
      - Web-Depolyment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./Client
        run: npm install

      - name: Build app
        working-directory: ./Client
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy/dist
          cp -r Client/dist/* deploy/dist/
          cp Client/server.js deploy/server.js
          cp Client/web.config deploy/web.config
          cp Client/package.json deploy/package.json
          cp Client/package-lock.json deploy/package-lock.json

      - name: Install production dependencies for runtime
        working-directory: ./deploy
        run: npm install --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Giacom'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
